elasticmq {

  # What is the outside visible address of this ElasticMQ node
  # Used to create the queue URL (may be different from bind address!)
  node-address {
    protocol = "http"
    host = "localhost"
    port = 9324
    context-path = ""
  }

  rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    # Possible values: relaxed, strict
    sqs-limits = strict

    auth {
      enabled = true
      access-key = "ABCD"
      secret-key = "ABCD"
      region = "us-east-1"
    }
  }

  rest-stats {
    enabled = true
    bind-port = 9325
    bind-hostname = "0.0.0.0"
  }

}

  # Should the node-address be generated from the bind port/hostname
  # Set this to true e.g. when assigning po
